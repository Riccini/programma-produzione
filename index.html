/* adatta ogni foglio a una pagina A4 orizzontale */
function fitPrint(){
  const el = document.getElementById("print"), MM = 96/25.4, maxH = 186*MM, W = 279*MM;
  const st = el.getAttribute("style") || "";
  el.style.cssText = `display:block;position:absolute;left:-10000px;top:0;width:${W}px;visibility:hidden`;
  el.querySelectorAll(".sheet").forEach(s => {
    s.style.zoom = ""; const h = s.scrollHeight;
    if (h > maxH) s.style.zoom = (maxH / h).toFixed(3);
  });
  el.setAttribute("style", st);
}

/* ---------- inserimento rapido guidato ---------- */
UI.qe = null; UI.fc = null;
const normN = s => { const n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? null : String(n); };
const famWords = f => famLabel(f).toLowerCase().split(/[\s,/+()]+/).filter(Boolean);
const QSTEPS = ["fam","dia","cls","col","len","art","code","fin","lav","qty","note"];
const lavOn = q => !q.todo && !!(REPARTI[UI.rep] && REPARTI[UI.rep].lav);
const finOn = q => !q.todo && !!(REPARTI[UI.rep] && REPARTI[UI.rep].fin);
const QIDX = { dia:3, cls:4, col:6, len:5 };
function newQe(line, day, text){
  const L = REPARTI[UI.rep].linee.find(l => l.id === line), fams = (L && L.nofam) || null;
  return { line, day, first: fams ? "dia" : "fam", fams, step: fams ? "dia" : "fam", sel:{ fam:null, dia:null, cls:null, col:null, len:null, art:null }, hist:[], raw:{}, custom:false, pend:null, code:"", text:text||"", qty:"", note:"", pick:0, err:"" }; }
function qLabel(q, st){
  const pre = q.sel.fam ? clsPrefix(q.sel.fam) : "PN";
  return { fam:"Famiglia", dia:"Diametro", cls: pre === "S" ? "Serie S" : pre, col: q.fams ? "Colore o tipologia" : "Colore o variante", len:"Lunghezza", art:"Articolo", code:"Codice articolo", lav:"Lavorazione", fin:"Codice finito (dopo la fessurazione)", qty:"Quantità", note:"Note" }[st];
}
function qFmt(q, st, v){
  if (st === "fam") return (famNum(v) ? famNum(v) + " " : "") + famLabel(v);
  if (v === "" || v == null) return st === "col" ? "standard" : "non indicato";
  if (st === "dia") return "Ø" + fmtNum(v);
  if (st === "cls") return clsPrefix(q.sel.fam) + fmtNum(v);
  if (st === "col") return v.toLowerCase();
  if (st === "len") return (["C6","P06"].includes(q.sel.fam) ? "Bobine da " : parseFloat(v) <= 13.6 ? "Barre da " : "Rotoli da ") + fmtNum(v) + " m";
  return v;
}
function qPartial(q, st){ const s = { fam:q.sel.fam, fams:q.fams, dia:null, cls:null, col:null, len:null }; for (const k of ["dia","cls","col","len"]){ if (k === st) break; s[k] = q.sel[k]; } return s; }
const qOpts = (q, st) => uniq(rowsFor(qPartial(q, st)), QIDX[st]);
function qLoose(q, st){ const o = qOpts(q, st); return o.length ? o : uniq(rowsFor({ fam:q.sel.fam, fams:q.fams, dia:null, cls:null, col:null, len:null }), QIDX[st]); }
function famMatches(text){
  const t = text.trim().toLowerCase(); if (!t) return [];
  const rep = REPARTI[UI.rep];
  const order = [...rep.fam, ...Object.keys(FAM).filter(f => !rep.fam.includes(f))].filter((f,i,a) => a.indexOf(f) === i && CODICI.some(r => r[2] === f));
  const num = t.replace(/^cod\.?\s*/, "").toUpperCase();
  if (/^\d+[A-Z]?$/.test(num)) return order.filter(f => f === "C" + num);
  return order.filter(f => famWords(f).some(w => w.startsWith(t)) || famLabel(f).toLowerCase().startsWith(t));
}
const findArt = text => { const t = text.trim().toLowerCase(); return t ? CODICI.find(r => r[0].toLowerCase() === t || r[0].toLowerCase() === t + ".") : null; };
function qMatch(q, st, text){
  const t = text.trim().toLowerCase(), opts = qOpts(q, st);
  if (!t) return opts.length === 1 ? opts[0] : opts.includes("") ? "" : null;
  if (st === "col"){ const ex = opts.find(o => o.toLowerCase() === t); if (ex != null) return ex; const m = opts.filter(o => o && o.toLowerCase().split(/\s+/).some(w => w.startsWith(t))); return m.length === 1 ? m[0] : null; }
  if (st === "len"){
    if (["b","barra","barre"].includes(t)){ const m = opts.filter(o => o && parseFloat(o) <= 13.6); return m.length === 1 ? m[0] : null; }
    if (["r","rotolo","rotoli"].includes(t)){ const m = opts.filter(o => parseFloat(o) > 13.6); return m.length === 1 ? m[0] : null; }
  }
  const n = normN(t.replace(/^(pn|sn|sdr|s|ø|d)\s*/, "").replace(/\s*m$/, ""));
  let m = opts.find(o => o.toLowerCase() === t || (n !== null && normN(o) === n));
  if (m == null && st === "cls" && q.sel.fam === "C7" && n !== null){ const v = String((parseFloat(n)-1)/2); m = opts.find(o => normN(o) === v); }
  return m ?? null;
}
function qAdvance(q){
  if (q.sel.art && QSTEPS.indexOf(q.step) < QSTEPS.indexOf("fin")){ q.hist.push(q.step); q.err = ""; if (finOn(q)){ q.step = "fin"; q.text = q.fin || ""; } else if (lavOn(q)){ q.step = "lav"; q.text = q.lav || ""; } else { q.step = "qty"; q.text = q.qty; } return; }
  q.hist.push(q.step); q.err = "";
  let i = QSTEPS.indexOf(q.step) + 1;
  while (i < QSTEPS.length){
    const st = QSTEPS[i];
    if (QIDX[st] !== undefined){
      const o = qOpts(q, st);
      const famRows = rowsFor({ fam:q.sel.fam, fams:q.fams, dia:null, cls:null, col:null, len:null });
      const asked = st === "col" ? (o.length > 1 || (!!q.fams && o.length > 0)) : st === "cls" && q.fams ? false : famRows.some(r => r[QIDX[st]]);
      if (!asked){ q.sel[st] = o.includes("") || !o.length ? "" : o[0]; i++; continue; }
      q.step = st; q.text = o.length === 1 ? fmtNum(o[0]) : (q.raw[st] || ""); q.pre = o.length === 1; return;
    }
    if (st === "art" && q.custom){ i++; continue; }
    if (st === "code"){ if (!q.custom){ i++; continue; } q.step = st; q.text = q.code; return; }
    if (st === "fin"){ if (!finOn(q)){ i++; continue; } q.step = st; q.text = q.fin || ""; return; }
    if (st === "lav"){ if (!lavOn(q)){ i++; continue; } q.step = st; q.text = q.lav || ""; return; }
    if (st === "art"){ const rs = rowsFor({ ...q.sel, fams:q.fams }); if (rs.length === 1){ q.sel.art = rs[0][0]; i++; continue; } q.pick = 0; q.step = st; q.text = ""; return; }
    q.step = st; q.text = st === "qty" ? q.qty : q.note; return;
  }
}
function qBack(q){
  if (!q.hist.length) return false;
  const st = q.hist.pop();
  if (q.step === "qty") q.qty = q.text; if (q.step === "note") q.note = q.text; if (q.step === "code") q.code = q.text; if (q.step === "lav") q.lav = q.text; if (q.step === "fin") q.fin = q.text;
  const from = QSTEPS.indexOf(st);
  if (from <= QSTEPS.indexOf("art")) QSTEPS.slice(from, QSTEPS.indexOf("art")+1).forEach(k => { if (k in q.sel) q.sel[k] = null; });
  q.step = st; q.err = ""; q.pend = null;
  if (st === "code"){ q.text = q.code; return true; }
  if (st === "lav"){ q.text = q.lav || ""; return true; }
  if (st === "fin"){ q.text = q.fin || ""; return true; }
  q.custom = ["dia","cls","col","len"].some(k => q.sel[k] != null) && !rowsFor({ ...q.sel, fams:q.fams }).length;
  q.text = st === "qty" ? q.qty : st === "note" ? q.note : (q.raw[st] || "");
  return true;
}
function qAccept(q){
  const text = q.text.trim();
  q.err = "";
  if (q.step === "fam"){
    const a = findArt(text);
    if (a){ q.sel = { fam:a[2], dia:a[3], cls:a[4], col:a[6], len:a[5], art:a[0] }; return true; }
    const fm = famMatches(text);
    if (fm.length === 1){ q.sel.fam = fm[0]; q.raw.fam = text; return true; }
    q.err = !text ? "Scrivi la famiglia" : fm.length ? "Più famiglie possibili: scrivi il numero" : "Famiglia non trovata: Invio o Tab lo salvano come testo libero";
    return false;
  }
  if (q.step === q.first && q.first !== "fam"){
    const a = findArt(text);
    if (a){ q.sel = { fam:a[2], dia:a[3], cls:a[4], col:a[6], len:a[5], art:a[0] }; return true; }
  }
  if (QIDX[q.step] !== undefined){
    let v = q.custom ? null : qMatch(q, q.step, text);
    if (v == null && q.custom) v = text ? (q.step === "col" ? text.toUpperCase() : normV(text)) : "";
    else if (v == null && text && !(q.step === "len" && /^(b|r|barr|rotol)/i.test(text))){
      if (q.pend && q.pend.step === q.step && q.pend.text === text){ q.custom = true; q.pend = null; v = q.step === "col" ? text.toUpperCase() : normV(text); }
      else { q.pend = { step:q.step, text }; q.err = `“${text}” non è a catalogo. Premi di nuovo Tab (o Invio) per usarlo comunque: diventa un articolo fuori catalogo e il codice lo scrivi tu.`; return false; }
    }
    if (v == null){ q.err = /^(b|r|barr|rotol)/i.test(text) && q.step === "len" ? "Ci sono più formati di quel tipo: scrivi la lunghezza" : text ? `“${text}” non è disponibile` : "Scrivi un valore tra quelli disponibili"; return false; }
    q.sel[q.step] = v; q.raw[q.step] = text; return true;
  }
  if (q.step === "art"){
    const rs = rowsFor({ ...q.sel, fams:q.fams }).slice(0, 12);
    const byNum = /^\d+$/.test(text) && +text >= 1 && +text <= rs.length ? rs[+text-1] : null;
    const byCode = rs.find(r => r[0].toLowerCase() === text.toLowerCase());
    const r = byNum || byCode || (!text ? rs[q.pick] : null);
    if (!r){ q.err = "Scegli l’articolo con ↑↓ o scrivi il numero"; return false; }
    q.sel.art = r[0]; return true;
  }
  if (q.step === "lav"){ q.lav = q.text.trim(); return true; }
  if (q.step === "fin"){ const v = q.text.trim(), a = findArt(v); q.fin = a ? a[0] : upCode(v); return true; }
  if (q.step === "code"){
    const code = q.text.trim(), ex = code && getArt(code);
    if (ex){ q.err = `Il codice ${code} esiste già: ${ex[1]}. Scrivi un codice diverso, oppure lascia vuoto.`; return false; }
    q.code = upCode(code); return true;
  }
  if (q.step === "qty"){ q.qty = q.text; return true; }
  if (q.step === "note"){ q.note = q.text; return true; }
}
function qSave(q){
  if (!q.sel.art && !q.custom) return false;
  snap();
  const s = q.sel;
  if (q.custom && !s.fam && q.fams) s.fam = q.fams[0];
  if (q.custom && q.code && registerArticle(q.code, { fam:s.fam, dia:s.dia||"", cls:s.cls||"", col:s.col||"", len:s.len||"" }) === "ok"){
    cellList(q.line, q.day).push({ id:uid(), art:q.code.trim(), text:null, lav:(q.lav||"").trim(), fin:(q.fin||"").trim(), qty:(q.qty||"").trim(), note:(q.note||"").trim(), cont:false });
    learnMachine(cellList(q.line, q.day).at(-1), UI.rep, q.line, false);
    Store.save(); toast(q.code.trim() + " aggiunto all’anagrafica"); return true;
  }
  cellList(q.line, q.day).push(q.custom
    ? { id:uid(), art:(q.code||"").trim(), text:null, custom:{ fam:s.fam, dia:s.dia||"", cls:s.cls||"", col:s.col||"", len:s.len||"" }, lav:(q.lav||"").trim(), fin:(q.fin||"").trim(), qty:(q.qty||"").trim(), note:(q.note||"").trim(), cont:false }
    : { id:uid(), art:s.art, text:null, lav:(q.lav||"").trim(), fin:(q.fin||"").trim(), qty:(q.qty||"").trim(), note:(q.note||"").trim(), cont:false });
  learnMachine(cellList(q.line, q.day).at(-1), UI.rep, q.line, false);
  Store.save(); return true;
}
function qSaveNote(q, text){ snap(); cellList(q.line, q.day).push({ id:uid(), art:null, text, qty:"", note:"", cont:false }); Store.save(); }
function qIdem(q){
  const prev = q.day ? cellList(q.line, q.day-1).filter(isProd) : [];
  if (!prev.length){ qSaveNote(q, q.text.trim()); q.idemMsg = "Testo salvato"; return true; }
  snap(); prev.forEach(e => cellList(q.line, q.day).push({ ...clone(e), id:uid(), cont:true, qty:"", note:"" })); Store.save(); q.idemMsg = "Ripetuto il giorno prima"; return true;
}
const isFreeText = q => !!q.text.trim() && !findArt(q.text) && (q.first === "fam" ? !famMatches(q.text).length : !/^\d/.test(q.text.trim()));
function qeHTML(){
  const q = UI.qe, crumbs = [];
  ["fam","dia","cls","col","len"].forEach(k => { if (q.sel[k] != null && (k === "fam" || q.sel[k] !== "" )) crumbs.push(`<span>${esc(qFmt(q, k, q.sel[k]))}</span>`); });
  if (q.sel.art) crumbs.push(`<span class="art">${esc(q.sel.art)}</span>`);
  if (q.custom) crumbs.push(`<span class="fcx">fuori catalogo</span>`);
  if (q.custom && q.code && q.step !== "code") crumbs.push(`<span class="art">${esc(q.code)}</span>`);
  if (["lav","qty","note"].includes(q.step) && q.fin) crumbs.push(`<span class="art">→ ${esc(q.fin)}</span>`);
  if ((q.step === "qty" || q.step === "note") && q.lav) crumbs.push(`<span>${esc(q.lav)}</span>`);
  if (q.step === "note" && q.qty) crumbs.push(`<span>${esc(q.qty)}</span>`);
  const nextDay = q.day < nDays()-1 ? GIORNI[q.day+1].toLowerCase() : "riga sotto";
  const sub = q.todo ? (q.step === "note" ? "Tab o Invio per aggiungere" : q.step === "qty" ? "metri o pezzi, oppure M per Magazzino" : q.step === "code" ? "puoi lasciarlo vuoto" : "")
    : q.step === "note" ? `Tab salva e va a ${nextDay}` : q.step === "qty" ? "facoltativa" : q.step === "code" ? "puoi lasciarlo vuoto" : q.step === "lav" ? "facoltativa" : q.step === "fin" ? "come diventerà il tubo cieco" : "";
  const ii = q.todo ? "tqi" : "qi", pi = q.todo ? "tqp" : "qp";
  return `<div class="qe">${crumbs.length ? `<div class="qcrumb">${crumbs.join("")}</div>` : ""}
    <label class="qlab" for="${ii}">${q.todo && q.step === "qty" ? "Quantità minima" : qLabel(q, q.step)}${sub ? `<small>${sub}</small>` : ""}</label>
    <input class="qi" id="${ii}" autocomplete="off" spellcheck="false" value="${esc(q.text)}">
    <div class="qp" id="${pi}"></div></div>`;
}
function quickPreview(){
  const q = UI.qe, qp = document.getElementById(q && q.todo ? "tqp" : "qp"); if (!qp || !q) return;
  const t = q.text.trim(), tl = t.toLowerCase();
  let h = q.err ? `<span class="err">${esc(q.err)}</span>` : "";
  if (q.step === "fam"){
    const a = findArt(t);
    if (tl === "idem") h += `<span class="opts">Invio ripete i prodotti di ${q.day ? GIORNI[q.day-1].toLowerCase() : "–"}</span>`;
    else if (a) h += `<span class="opts">Codice trovato: <b>${esc(a[0])}</b> ${esc(famLabel(a[2])+" "+spec(a))}. Tab per la quantità, Invio per salvare</span>`;
    else {
      const fm = t ? famMatches(t) : REPARTI[UI.rep].fam.filter(f => CODICI.some(r => r[2] === f));
      if (t && !fm.length) h += `<span class="opts">Testo libero: Invio o Tab per salvarlo così com’è.</span>`;
      else h += `${t ? "" : "Numero o nome della famiglia, codice articolo, oppure un testo libero (manutenzione, idem…). "}<span class="opts">${fm.slice(0,10).map(f => esc(qFmt(q,"fam",f))).join(", ")}${fm.length > 10 ? "…" : ""}</span>`;
    }
  } else if (QIDX[q.step] !== undefined){
    if (q.step === q.first && !t) h += `Diametro, codice articolo, oppure un testo libero (manutenzione, idem…). `;
    if (q.step === q.first && t && isFreeText(q)) h += `<span class="opts">Testo libero: Invio o Tab per salvarlo così com’è.</span> `;
    const opts = q.custom ? qLoose(q, q.step).filter(Boolean) : qOpts(q, q.step), m = t && !q.custom ? qMatch(q, q.step, t) : null;
    h += q.custom ? `Fuori catalogo: scrivi il valore che ti serve. ` : "";
    h += `${q.custom ? "A catalogo per questa famiglia" : "Disponibili"}: <span class="opts">${opts.map(o => { const s = esc(qFmt(q, q.step, o)); return o === m ? `<u>${s}</u>` : s; }).join(", ")}</span>`;
  } else if (q.step === "art"){
    const rs = rowsFor({ ...q.sel, fams:q.fams }).slice(0, 12);
    h += `Più articoli con questi dati: scegli con ↑↓ o scrivi il numero<ul>${rs.map((r,k) => `<li data-k="${k}" aria-selected="${k===q.pick}">${k+1}. <b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join("")}</ul>`;
  } else if (q.step === "fin"){
    const base = q.sel.art || q.code, sg = finSuggest(base), a = t ? findArt(t) : null;
    h += a ? `<span class="opts">In anagrafica: <b>${esc(a[0])}</b> ${esc(a[1])}</span>` : t ? `<span class="opts">Codice non ancora in anagrafica: va bene lo stesso.</span>` : `Scrivi il codice del tubo finito${base ? ` partendo da ${esc(base)}` : ""}.`;
    if (sg.length && !a) h += `<ul>${sg.map(r => `<li data-fin="${esc(r[0])}"><b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join("")}</ul>`;
  } else if (q.step === "lav") h += `Per esempio F6N slot 4,00 mm. Invio salva subito.`;
  else if (q.step === "code") h += `Scrivi il codice da usare per questo articolo fuori catalogo, oppure lascia vuoto e lo completi più avanti.`;
  else if (q.step === "qty") h += q.todo ? `Per esempio 3036 m, oppure M se è da fare per magazzino. Invio aggiunge subito.` : `Per esempio 10 bancali, 768 m. Invio salva subito.`;
  else if (q.step === "note") h += `Per esempio riserva, marcatura Carini. Invio salva e resta nella cella.`;
  qp.innerHTML = h;
  qp.querySelectorAll("li[data-k]").forEach(li => li.onmousedown = ev => { ev.preventDefault(); q.pick = +li.dataset.k; q.text = ""; if (qAccept(q)){ qAdvance(q); render(); } });
  qp.querySelectorAll("li[data-fin]").forEach(li => li.onmousedown = ev => { ev.preventDefault(); q.text = li.dataset.fin; if (qAccept(q)){ qAdvance(q); render(); } });
}
function openQuick(line, day, text){ if (readOnly()) return; if (isActLine(line)) return openActPicker(line, day); UI.qe = newQe(line, day, text); UI.fc = { line, day }; render(); }
function moveFocus(line, day, dl, dd){
  const ids = REPARTI[UI.rep].linee.map(l => l.id);
  let li = ids.indexOf(line) + dl, d = day + dd;
  const last = nDays() - 1;
  if (d > last){ d = 0; li++; } if (d < 0){ d = last; li--; }
  li = Math.max(0, Math.min(ids.length-1, li));
  return { line:ids[li], day:d };
}
function qRestart(q, msg){ UI.qe = newQe(q.line, q.day, ""); UI.qe.err = ""; render(); if (msg) toast(msg); }
function afterRender(){
  const qi = document.getElementById("qi");
  if (qi && UI.qe && !UI.qe.todo){
    const q = UI.qe;
    qi.focus(); if (q.pre){ qi.select(); q.pre = false; } else qi.setSelectionRange(qi.value.length, qi.value.length); quickPreview();
    qi.oninput = () => { q.text = qi.value; q.err = ""; if (q.pend && q.pend.text !== qi.value.trim()) q.pend = null; quickPreview(); };
    qi.onblur = () => setTimeout(() => {
      if (UI.qe === q && document.activeElement !== document.getElementById("qi") && !dlg.open){
        if (q.step === "qty") q.qty = q.text; if (q.step === "note") q.note = q.text;
        const saved = (q.step === "qty" || q.step === "note") && qSave(q);
        UI.qe = null; render(); if (saved) toast("Salvato " + (q.sel.art || q.code || "articolo fuori catalogo"));
      }
    }, 150);
    qi.onkeydown = ev => {
      const empty = !q.text.trim() && q.step === q.first && !q.hist.length;
      if (ev.key === "Escape"){ ev.preventDefault(); UI.qe = null; render(); return; }
      if (q.step === "art" && (ev.key === "ArrowDown" || ev.key === "ArrowUp")){
        ev.preventDefault(); const n = Math.min(rowsFor({ ...q.sel, fams:q.fams }).length, 12);
        q.pick = Math.max(0, Math.min(n-1, q.pick + (ev.key === "ArrowDown" ? 1 : -1))); quickPreview(); return;
      }
      if (empty && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(ev.key)){
        ev.preventDefault(); const dir = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[ev.key];
        UI.qe = null; UI.fc = moveFocus(q.line, q.day, ...dir); render(); return;
      }
      if (ev.key.toLowerCase() === "z" && (ev.ctrlKey || ev.metaKey) && empty){ ev.preventDefault(); UI.qe = null; undo(); return; }
      if (ev.key === "Tab" && ev.shiftKey){
        ev.preventDefault();
        if (qBack(q)) return render();
        if (empty){ const n = moveFocus(q.line, q.day, 0, -1); UI.qe = newQe(n.line, n.day); UI.fc = n; render(); }
        return;
      }
      if (ev.key === "Tab"){
        ev.preventDefault();
        if (empty){ const n = moveFocus(q.line, q.day, 0, 1); UI.qe = newQe(n.line, n.day); UI.fc = n; return render(); }
        if (q.step === q.first && q.text.trim().toLowerCase() === "idem"){ if (qIdem(q)){ const n = moveFocus(q.line, q.day, 0, 1); UI.qe = newQe(n.line, n.day); UI.fc = n; render(); toast(q.idemMsg); } else quickPreview(); return; }
        if (q.step === q.first && isFreeText(q)){ qSaveNote(q, q.text.trim()); const n = moveFocus(q.line, q.day, 0, 1); UI.qe = newQe(n.line, n.day); UI.fc = n; render(); toast("Testo salvato"); return; }
        if (!qAccept(q)){ quickPreview(); qi.select(); return; }
        if (q.step === "note"){
          if (qSave(q)){ const n = moveFocus(q.line, q.day, 0, 1); UI.qe = newQe(n.line, n.day); UI.fc = n; render(); toast("Salvato " + (q.sel.art || q.code || "articolo fuori catalogo")); }
          return;
        }
        qAdvance(q); return render();
      }
      if (ev.key === "Enter"){
        ev.preventDefault();
        if (empty){ const n = moveFocus(q.line, q.day, 1, 0); UI.qe = null; UI.fc = n; return render(); }
        if (q.step === q.first){
          const tl = q.text.trim().toLowerCase();
          if (tl === "idem"){ if (qIdem(q)) qRestart(q, q.idemMsg); else quickPreview(); return; }
          if (isFreeText(q)){ qSaveNote(q, q.text.trim()); return qRestart(q, "Testo salvato"); }
        }
        if (!qAccept(q)){ quickPreview(); qi.select(); return; }
        if (q.step !== "qty" && q.step !== "note") qAdvance(q);
        if ((q.sel.art || q.custom) && (q.step === "qty" || q.step === "note")){ qSave(q); return qRestart(q, "Salvato " + (q.sel.art || q.code || "articolo fuori catalogo") + ", scrivi il prossimo"); }
        return render();
      }
    };
  } else if (UI.fc){
    const c = document.querySelector(`.cell[data-line="${UI.fc.line}"][data-day="${UI.fc.day}"]`);
    if (c && document.activeElement !== c && !dlg.open) c.focus();
  }
  const g = document.getElementById("grid"); if (!g) return;
  g.addEventListener("focusin", ev => { const c = ev.target.closest(".cell[tabindex]"); if (c && ev.target === c) UI.fc = { line:c.dataset.line, day:+c.dataset.day }; });
  g.addEventListener("dblclick", ev => { const c = ev.target.closest(".cell[tabindex]"); if (c && !ev.target.closest(".job") && !ev.target.closest(".qe")) openQuick(c.dataset.line, +c.dataset.day, ""); });
  g.addEventListener("keydown", ev => {
    const c = ev.target.closest(".cell[tabindex]"); if (!c || ev.target !== c) return;
    const line = c.dataset.line, day = +c.dataset.day;
    const dir = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[ev.key];
    if (dir){ ev.preventDefault(); UI.fc = moveFocus(line, day, ...dir); const n = document.querySelector(`.cell[data-line="${UI.fc.line}"][data-day="${UI.fc.day}"]`); if (n) n.focus(); return; }
    if (ev.key === "Enter" || ev.key === "F2" || ev.key === "+"){ ev.preventDefault(); openQuick(line, day, ""); return; }
    if (ev.key === "Delete" || ev.key === "Backspace"){
      ev.preventDefault(); const L = cellList(line, day); if (!L.length) return;
      snap(); const e = L.pop(); UI.fc = { line, day }; commit("Tolto " + (e.art || "nota") + ", Ctrl+Z per annullare"); return;
    }
    if (ev.key.toLowerCase() === "z" && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); UI.fc = { line, day }; undo(); return; }
    if (isActLine(line) && /^[1-7]$/.test(ev.key)){ ev.preventDefault(); toggleAct(line, day, ev.key); return; }
    if (isActLine(line) && ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey){ ev.preventDefault(); openActPicker(line, day, ev.key); return; }
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey){ ev.preventDefault(); openQuick(line, day, ev.key); }
  });
}

render();
</script>
