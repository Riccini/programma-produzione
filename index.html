<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F4F6F6; --ink:#1B2226; --muted:#5D6A70; --line:#CBD2D4; --line2:#DDE2E3;
  --accent:#1C5A96; --accent-ink:#FFFFFF; --warn:#A8471B; --warnbg:#FBEADF; --ok:#2C7A4B; --okbg:#E1F1E7;
  --today:#F1F6FB; --drop:#D7E6F5; --backlog:#F6F7F7;
  --sep:#A9B2B6; --sep2:#7D888D; --alt:#EEF1F2; --altToday:#E2EAF2;
  --u-alta:#B4321E; --u-media:#C28A12; --u-bassa:#7D8A90;
  --font:"Poppins", "Century Gothic", "Segoe UI", system-ui, -apple-system, sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13181A; --surface:#1C2326; --sunk:#171D20; --ink:#E4E9EA; --muted:#97A3A8; --line:#343E42; --line2:#2A3236;
    --accent:#6EA7DD; --accent-ink:#0E1A26; --warn:#E59468; --warnbg:#3A2418; --ok:#7CC79A; --okbg:#1B3326;
    --today:#1C2B38; --drop:#21384D; --backlog:#182023;
    --u-alta:#EC7B66; --u-media:#E2B44C; --u-bassa:#8E9BA1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13181A; --surface:#1C2326; --sunk:#171D20; --ink:#E4E9EA; --muted:#97A3A8; --line:#343E42; --line2:#2A3236;
  --accent:#6EA7DD; --accent-ink:#0E1A26; --warn:#E59468; --warnbg:#3A2418; --ok:#7CC79A; --okbg:#1B3326;
  --today:#1C2B38; --drop:#21384D; --backlog:#182023;
  --u-alta:#EC7B66; --u-media:#E2B44C; --u-bassa:#8E9BA1;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px}
.brand{font:700 15px/1 var(--cond);letter-spacing:.02em;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;font:600 15px/1.2 var(--cond);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.week{display:flex;align-items:center;gap:6px;margin-left:auto}
.week .lbl{text-align:center;min-width:170px}
.week .n{font:700 22px/1 var(--cond);display:block}
.week .d{font-size:13px;color:var(--muted)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:18px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.primary[disabled]{opacity:.45;cursor:not-allowed}
.danger{border:1px solid var(--warn);color:var(--warn);background:none;border-radius:8px;padding:7px 12px;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 20px;border-top:1px solid var(--line2);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-weight:500}
.status.ok{background:var(--okbg);color:var(--ok)}
.status.dirty{background:var(--warnbg);color:var(--warn)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sub select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px}
.sub .spacer{flex:1}
.banner{margin:12px 20px 0;padding:10px 14px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- grid ---------- */
.wrap{padding:16px 20px 40px}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid{display:grid}
.h{position:sticky;top:0;background:var(--sunk);padding:9px 10px;border-bottom:2px solid var(--sep2);border-right:1.5px solid var(--sep);font:600 14px/1.2 var(--cond);color:var(--muted)}
.h b{display:block;color:var(--ink);font-size:16px}
.h.today{background:var(--today)}
.h.bl{background:var(--backlog)}
.ln{position:sticky;left:0;z-index:2;background:var(--surface);padding:12px 10px;border-bottom:2px solid var(--sep2);border-right:2px solid var(--sep2)}
.ln b{font:700 17px/1.1 var(--cond);display:block}
.ln span{font-size:13px;color:var(--muted)}
.h.first{position:sticky;left:0;z-index:3;border-right:1px solid var(--line)}
.cell{padding:6px;border-bottom:2px solid var(--sep2);border-right:1.5px solid var(--sep);display:flex;flex-direction:column;gap:5px;min-height:96px}
.cell.today{background:var(--today)}
.cell.blc{background:var(--backlog);border-right:0}
.cell.over{background:var(--drop);outline:2px dashed var(--accent);outline-offset:-4px}
.job{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--stripe,#888);border-radius:6px;padding:5px 7px 6px;position:relative}
.job:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.job:hover{border-color:var(--muted);border-left-color:var(--stripe)}
.job .c{font:700 15px/1.15 var(--cond);letter-spacing:.01em;overflow-wrap:anywhere}
.job .s{font-size:13px;color:var(--muted);line-height:1.25}
.job .q{font-size:13px;margin-top:2px}
.job .q i{color:var(--muted)}
.job.cont{background:transparent;border-style:dashed;border-left-style:solid}
.job.cont .c::before{content:"↳ ";color:var(--muted);font-weight:600}
.job .tag{font-size:12px;color:var(--muted)}
.job .tag.fc{color:var(--warn);font-weight:600}
.job.nota{border-left-color:var(--muted);background:var(--sunk)}
.job.nota .c{font:500 14px/1.3 var(--font);word-break:normal;overflow-wrap:anywhere}
.job.miss{border-color:var(--warn)}
.job.miss .s{color:var(--warn)}
.blitem .u{font:600 12px/1 var(--cond);display:inline-flex;align-items:center;gap:5px;margin-bottom:3px}
.blitem .u::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--uc)}
.add{all:unset;cursor:pointer;margin-top:auto;font-size:13px;color:var(--muted);padding:3px 6px;border-radius:5px;border:1px dashed transparent;align-self:flex-start}
.add:hover,.add:focus-visible{border-color:var(--line);color:var(--accent)}
.ro .add{display:none}
.ro .job{cursor:zoom-in}
.satb{all:unset;cursor:pointer;display:block;margin-top:3px;font:600 12px/1.2 var(--font);color:var(--accent)}
.satb:hover,.satb:focus-visible{text-decoration:underline}
.famleg{font-size:13px;line-height:1.5;color:var(--muted);margin:0 2px 10px;max-width:none}
.famleg b{color:var(--ink)}
.gnote{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gnote label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.gnote label b{font:700 16px var(--cond);color:var(--ink);margin-right:6px}
.gnote textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;resize:vertical;font-size:15px}
.gnv{white-space:pre-wrap;font-size:15px}
.banner .primary{margin-left:auto}
.cv{border:1px solid var(--line);border-left:8px solid var(--stripe);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.cvc{font:700 34px/1.1 var(--cond);word-break:break-all}
.cvc .fn{font-size:22px;height:30px;min-width:32px;vertical-align:5px}
.cvd{font-size:16px;margin-top:4px}
.cvs{font-size:15px;color:var(--muted);margin-top:2px}
.cvf{margin-bottom:12px}
.cvf span{display:block;font-size:13px;color:var(--muted)}
.cvf p{margin:2px 0 0;font-size:20px;line-height:1.4;white-space:pre-wrap}
.k.note{background:var(--today);color:var(--accent)}
.ocard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--surface)}
.ocard[draggable="true"]{cursor:grab}
.ocard.dragging{opacity:.4}
.ocard.odropb{box-shadow:-5px 0 0 0 var(--accent)}
.ocard.odropa{box-shadow:5px 0 0 0 var(--accent)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ogrid .ocard{margin:0;display:flex;flex-direction:column;gap:6px;min-height:260px;border-width:1px;padding:14px 16px}
.ocard.t-azzurro{background:linear-gradient(160deg,#E4F3FC 0%,#F6FBFE 100%);border-color:#BFE2F5}
.ocard.t-verde{background:linear-gradient(160deg,#E3F3E6 0%,#F6FBF7 100%);border-color:#BFE2C6}
.ocard.t-arancio{background:linear-gradient(160deg,#FCEBDA 0%,#FEF8F2 100%);border-color:#F1D2B0}
.ocard.t-neutro{background:linear-gradient(160deg,#F0F3F5 0%,#FAFBFC 100%)}
.otop{display:flex;align-items:center;gap:8px}
.onum{font:600 13.5px var(--font);color:var(--muted)}
.ocard .oclient{font:700 21px/1.2 var(--font);color:var(--ink)}
.ofam{font:700 15px/1.3 var(--font);color:#0B5E8E}
.oplan{align-self:flex-start;margin:0}
.orows{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.orw{background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.06);border-radius:8px;padding:6px 8px}
.orwc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}

function bindMobile(){
  document.querySelectorAll("[data-mday]").forEach(b => b.onclick = () => { UI.mday = +b.dataset.mday; render(); window.scrollTo(0, 0); });
  const g = document.getElementById("grid"); if (!g) return;
  let x0 = null, y0 = null;
  g.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  g.addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const ND = document.querySelectorAll("[data-mday]").length;
    const nd = UI.mday + (dx < 0 ? 1 : -1);
    if (nd >= 0 && nd < ND){ UI.mday = nd; render(); window.scrollTo(0, 0); }
  }, { passive:true });
}

  document.querySelectorAll("[data-sat]").forEach(b => b.onclick = () => {

    w.sat = b.dataset.sat === "on"; commit(w.sat ? "Sabato aggiunto" : "Sabato tolto");
  });
  const gn = $("gnote");
  if (gn){
    gn.onfocus = () => { UI.fc = null; UI.qe = null; snap(); };
    gn.oninput = () => { const w = weekObj(UI.wk, true); w.draft.note = gn.value; Store.save(); };
  }
  if ($("sblocca")) $("sblocca").onclick = () => { UI.unlocked[UI.wk] = true; render(); };
  $("pubblica").onclick = openPublish;
  $("stampa").onclick = () => openPrint(false);
  $("pdf").onclick = () => openPrint(true);
  $("contatti").onclick = openContacts;
  $("anag").onclick = openCatalog;
  $("todoall").onclick = () => openTodo(null, null);
  const g = $("grid"), ro = readOnly();
  g.onclick = e => {
    const qk = e.target.closest("[data-quick]");
    if (qk && !ro){ const [line,day] = qk.dataset.quick.split("|"); return openQuick(line, +day, ""); }
    const spb = e.target.closest("[data-span]");
    if (spb){ const [ln, ix] = spb.dataset.span.split("|"); return openSpan(ln, +ix); }
    const ordb = e.target.closest("[data-ord]");
    if (ordb) return openOrders(UI.rep, ordb.dataset.ord);
    const tdo = e.target.closest("[data-todo]");
    if (tdo) return openTodo(UI.rep, tdo.dataset.todo);
    const add = e.target.closest("[data-add]"), addbl = e.target.closest("[data-addbl]"), job = e.target.closest(".job");
    if (add && !ro){ const [line,day] = add.dataset.add.split("|"); if (isActLine(line)) return openActPicker(line, +day); openEditor({mode:"job", line, day:+day}); }
    else if (addbl){ openEditor({mode:"bl", line:addbl.dataset.addbl}); }
    else if (job && job.dataset.bl){ openEditor({mode:"bl", blId:job.dataset.bl}); }
    else if (job && !ro && isActLine(job.dataset.line)){ openActPicker(job.dataset.line, +job.dataset.day); }
    else if (job && !ro){ openEditor({mode:"job", line:job.dataset.line, day:+job.dataset.day, id:job.dataset.id}); }
    else if (job && ro){ openCardView(job.dataset.line, +job.dataset.day, (job.dataset.ids || job.dataset.id).split(",")); }
  };
  const dropBefore = (c, y) => [...c.querySelectorAll(":scope > .job")].filter(x => !x.classList.contains("dragging")).find(x => { const r = x.getBoundingClientRect(); return r.top + r.height / 2 > y; }) || null;
  const clearMarks = () => g.querySelectorAll(".over,.dropb,.drope").forEach(x => x.classList.remove("over","dropb","drope"));
  g.ondragstart = e => {
    const el = e.target.closest("[data-drag]"); if (!el) return;
    const k = el.dataset.drag;
    const p = k === "bl" ? {src:"bl", id:el.dataset.bl} : k === "span" ? {src:"span", line:el.dataset.sline, idx:+el.dataset.idx} : {src:"cell", id:el.dataset.id, line:el.dataset.line, day:+el.dataset.day};
    e.dataTransfer.setData("text/plain", JSON.stringify(p)); e.dataTransfer.effectAllowed = "copyMove";
    setTimeout(() => el.classList.add("dragging"), 0);
  };
  g.ondragend = () => { g.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); clearMarks(); };
  g.ondragover = e => {
    const c = e.target.closest(".cell"); if (!c || (ro && !c.dataset.blline)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = (e.ctrlKey || e.altKey) ? "copy" : "move";
    clearMarks(); c.classList.add("over");
    if (!c.dataset.blline){ const before = e.shiftKey ? null : dropBefore(c, e.clientY); if (before) before.classList.add("dropb"); else if (!e.shiftKey) c.classList.add("drope"); }
  };
  g.ondragleave = e => { const c = e.target.closest(".cell"); if (c && !c.contains(e.relatedTarget)){ c.classList.remove("over","drope"); c.querySelectorAll(".dropb").forEach(x => x.classList.remove("dropb")); } };
  g.ondrop = e => {
    const c = e.target.closest(".cell"); if (!c) return; e.preventDefault();
    const before = dropBefore(c, e.clientY), over = e.target.closest(".job");
    clearMarks();
    let p; try { p = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_){ return; }
    moveTo(p, c.dataset.blline ? {bl:c.dataset.blline} : {line:c.dataset.line, day:+c.dataset.day, beforeId: before && before.dataset.id, copy: e.ctrlKey || e.altKey, swapId: e.shiftKey && over ? over.dataset.id : null});
  };
}
function cellList(line, day, rep){ const w = weekObj(UI.wk, true); return w.draft[rep || UI.rep][line][day]; }
function moveTo(p, to){
  snap();
  if (p.src === "bl"){
    const b = S.backlog.find(x => x.id === p.id); if (!b) return;
    if (to.bl){ b.line = to.bl; return commit("Spostato su " + REPARTI[UI.rep].linee.find(l=>l.id===to.bl).nome); }
    if (readOnly()) return;
    const e = clone(b.entry); e.id = uid(); e.cont = false; if (b.rif) e.note = [e.note, b.rif].filter(Boolean).join(" – ");
    S.backlog = S.backlog.filter(x => x.id !== p.id);
    if (b.line !== to.line) toast("Attenzione: era previsto su un’altra linea");
    cellList(to.line, to.day).push(e);
    return commit(`Programmato ${GIORNI[to.day].toLowerCase()}`);
  }
  if (readOnly()) return;
  const insertAt = (dst, el) => { const k = to.beforeId ? dst.findIndex(x => x.id === to.beforeId) : -1; if (k < 0) dst.push(el); else dst.splice(k, 0, el); };
  if (p.src === "todo"){ if (!to.bl && to.line != null && !isActLine(to.line)) dropTodoOnDay(p.id, to.line, to.day, to.beforeId); return; }
  if (p.src === "order"){ if (!to.bl && to.line != null) { if (ODRAG) ODRAG.dropped = true; dropOrderOnDay(p.id, to.line, to.day, to.beforeId); } return; }
  if (p.src === "span"){
    const sl = spanList(UI.rep, p.line); if (!sl[p.idx]) return;
    const [x] = sl.splice(p.idx, 1);
    if (to.bl){ returnToList(x, UI.rep, p.line, UI.wk); return commit("Rimesso tra il materiale da produrre"); }
    insertAt(cellList(to.line, to.day), x); return commit("Assegnato a " + GIORNI[to.day].toLowerCase());
  }
  const src = cellList(p.line, p.day), i = src.findIndex(x => x.id === p.id); if (i < 0) return;
  if (to.copy && !to.bl){ const c2 = { ...clone(src[i]), id:uid() }; insertAt(cellList(to.line, to.day), c2); return commit("Copiato a " + GIORNI[to.day].toLowerCase()); }
  if (to.swapId && to.swapId !== p.id && !to.bl){
    const dst = cellList(to.line, to.day), j = dst.findIndex(x => x.id === to.swapId);
    if (j >= 0){ const a = src[i]; src[i] = dst[j]; dst[j] = a; return commit("Articoli invertiti"); }
  }
  const [e] = src.splice(i,1);
  if (to.bl){ const w = returnToList(e, UI.rep, to.bl, UI.wk); return commit(w === "ordine" ? "Rimesso tra gli ordini da lavorare" : "Rimesso nell’elenco da produrre"); }
  insertAt(cellList(to.line, to.day), e); commit(p.line === to.line && p.day === to.day ? "Ordine cambiato" : "Spostato a " + GIORNI[to.day].toLowerCase());
}

function groupDay(list){
  const groups = [], byKey = new Map();
  let ag = null;
  list.forEach(e => {
    if (e.act){ if (!ag){ ag = { act:true, items:[] }; groups.push(ag); } ag.items.push(e); return; }
    if (!isProd(e)){ groups.push({ nota:true, items:[e] }); return; }
    const r = rowOf(e), key = r ? [r[2], r[3], r[4], r[6], isFluid(e, r) ? "F" : ""].join("|") : "x" + e.id;
    if (byKey.has(key)) byKey.get(key).items.push(e);
    else { const g = { r, items:[e], fluid:isFluid(e, r) }; byKey.set(key, g); groups.push(g); }
  });
  return groups;
}

const gKey = g => (!g || g.nota || g.act || !g.r) ? null : [g.r[2], g.r[3], g.r[4], g.r[6], g.fluid ? "F" : ""].join("|");
function layoutRuns(days, ND){
  const runs = [], open = new Map();
  for (let d = 0; d < ND; d++){
    const next = new Map();
    (days[d] || []).forEach(g => {
      const k = gKey(g), prev = k && open.get(k);
      if (prev && prev.end === d - 1){ prev.end = d; prev.parts.push({ day:d, g }); next.set(k, prev); }
      else { const r = { start:d, end:d, parts:[{ day:d, g }] }; runs.push(r); if (k) next.set(k, r); }
    });
    open.clear(); next.forEach((v, k) => open.set(k, v));
  }
  const occ = [];
  runs.forEach(r => {
    let i = 0;
    for (;; i++){ if (!occ[i]) occ[i] = []; let free = true; for (let d = r.start; d <= r.end; d++) if (occ[i][d]) { free = false; break; } if (free) break; }
    for (let d = r.start; d <= r.end; d++) occ[i][d] = r;
    r.slot = i;
  });

const itemSig = list => list.map(e => [e.art || e.text || "", e.fin || "", e.lav || "", e.qty || "", e.note || ""].join("|")).join(";");
function runRange(r){ const m = fromKey(UI.wk), a = addDays(m, r.start), b = addDays(m, r.end); return `${GG[r.start].toLowerCase()} ${a.getDate()} – ${GG[r.end].toLowerCase()} ${b.getDate()}`; }

/* ---------- indice di ciò che è realmente nel programma ---------- */
let PI_S = null, PI_V = -1, PI_MAP = null, PI_VER = 0;
function progIndex(){
  if (PI_S === S && PI_V === PI_VER && PI_MAP) return PI_MAP;
  const m = new Map();
  const add = (k, wk) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(wk); };
  const see = (e, wk) => { if (!e) return; if (e.rowId) add("o:" + e.rowId, wk); if (e.todoId) add("t:" + e.todoId, wk); };
  Object.entries(S.weeks || {}).forEach(([wk, w]) => {
    const d = w.draft || {};
    REPS.forEach(r => Object.values(d[r] || {}).forEach(days => (days || []).forEach(list => (list || []).forEach(e => see(e, wk)))));
    Object.values(d.spans || {}).forEach(lines => Object.values(lines || {}).forEach(list => (list || []).forEach(e => see(e, wk))));
  });
  PI_S = S; PI_V = PI_VER; PI_MAP = m; return m;
}
const rowWeeks = rw => [...(progIndex().get("o:" + rw.id) || [])].sort();
function plannedOf(b){
  const wks = progIndex().get("t:" + b.id) || new Set();
  return (b.planned || []).filter(p => wks.has(p.wk));
}

let ODRAG = null;
function bindOrderDrag(){
  const cards = [...dlg.querySelectorAll("[data-ocard]")];
  cards.forEach(c => {
    c.querySelectorAll("select,button,input").forEach(x => x.addEventListener("mousedown", ev => ev.stopPropagation()));
    c.ondragstart = e => {
      if (e.target.closest("select,button")) { e.preventDefault(); return; }
      ODRAG = { id:c.dataset.ocard, out:false, dropped:false };
      e.dataTransfer.setData("text/plain", JSON.stringify({ src:"order", id:c.dataset.ocard }));
      e.dataTransfer.effectAllowed = "copyMove";
      setTimeout(() => c.classList.add("dragging"), 0);
    };
    c.ondragover = e => {
      if (!ODRAG || ODRAG.out || c.dataset.ocard === ODRAG.id) return;
      e.preventDefault(); cards.forEach(x => x.classList.remove("odropb","odropa"));
      const r = c.getBoundingClientRect(); c.classList.add(e.clientX < r.left + r.width / 2 ? "odropb" : "odropa");
    };
    c.ondrop = e => {
      if (!ODRAG || ODRAG.out) return; e.preventDefault();
      const r = c.getBoundingClientRect(), after = e.clientX >= r.left + r.width / 2;
      reorderOrder(ODRAG.id, c.dataset.ocard, after); ODRAG.dropped = true;
    };
    c.ondragend = () => {
      const st = ODRAG; ODRAG = null;
      dlg.classList.remove("dragout"); const bk = document.getElementById("nmback"); if (bk && dlg.open) bk.className = "on";
      drawOrders();
    };
  });
  /* uscendo dalla finestra con l'ordine, la finestra si toglie di mezzo e si vede la settimana */
  if (!bindOrderDrag.doc){
    bindOrderDrag.doc = true;
    document.addEventListener("dragover", e => {
      if (!ODRAG || ODRAG.out || !dlg.open) return;
      const r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){
        ODRAG.out = true; dlg.classList.add("dragout"); const bk = document.getElementById("nmback"); if (bk) bk.className = "on out";
      }
    }, true);
  }
}
function reorderOrder(id, targetId, after){
  const list = ordersOfLine(OD.rep, OD.line), from = list.findIndex(o => o.id === id); if (from < 0) return;
  snap();
  const [m] = list.splice(from, 1);
  let to = list.findIndex(o => o.id === targetId); if (to < 0) to = list.length; else if (after) to++;
  list.splice(to, 0, m);
  list.forEach((o, i) => o.pos = i);
  Store.save(); render();
}
/* ordine posato su un giorno: tutti i suoi articoli in quel giorno */
function dropOrderOnDay(id, line, day, beforeId){
  const o = (S.orders || []).find(x => x.id === id); if (!o) return;
  if (readOnly()) return toast("Per programmare entra in Modifica il programma");
  snap();
  const dst = cellList(line, day, o.rep), sl = spanList(o.rep, o.line, UI.wk);
  const inWeek = rw => { const w = S.weeks[UI.wk]; return REPARTI[o.rep].linee.some(l => (w.draft[o.rep][l.id] || []).some(list => list.some(e => e.rowId === rw.id))); };
  let n = 0;
  o.rows.forEach(rw => {
    const si = sl.findIndex(e => e.rowId === rw.id);
    let e = null;
    if (si >= 0) e = sl.splice(si, 1)[0];
    else if (!inWeek(rw)) e = orderEntry(o, rw);
    if (e){ const k = beforeId ? dst.findIndex(x => x.id === beforeId) : -1; if (k < 0) dst.push(e); else dst.splice(k, 0, e); n++; }
  });
  if (!n){ UNDO.pop(); return toast(`L’ordine ${o.num} è già in questa settimana`); }
  commit(`Ordine ${o.num}: ${n} ${n === 1 ? "articolo" : "articoli"} in ${GIORNI[day].toLowerCase()}`);
}
function orderEntry(o, rw){
  const e = { id:uid(), art: rw.art || "", text:null, fin: rw.fin || "", lav: rw.lav || "", qty: rw.qty || "", note: ["Ord. " + (o.num || "–"), o.client].filter(Boolean).join(" – "), cont:false, ordId:o.id, rowId:rw.id };
  if (!rw.art || !getArt(rw.art)){ if (rw.man && rw.man.fam) e.custom = { ...rw.man }; }
  return e;
}
function scheduleOrder(id, wk){
  const o = S.orders.find(x => x.id === id); if (!o || LOADING) return;
  const todo = o.rows.filter(rw => !rowWeeks(rw).includes(wk));
  if (!todo.length) return toast("Questo ordine è già in quella settimana");
  snap();
  todo.forEach(rw => { spanList(o.rep, o.line, wk).push(orderEntry(o, rw)); (rw.planned = rw.planned || []).push({ wk, at:new Date().toISOString() }); });
  commit(`Ordine ${o.num || ""} messo nella settimana ${isoWeek(fromKey(wk))}`); drawOrders();
}

      if (!o){
        const pos = (S.orders || []).filter(x => x.rep === rep && x.line === line).reduce((mx, x) => Math.max(mx, x.pos ?? -1), -1) + 1;
        o = { id:e.ordId || uid(), pos, rep, line, num: m ? m[1].trim() : "da completare", date:"", client: m && m[2] ? m[2].trim() : "", note:"", urg:"Media", at:new Date().toISOString(), rows:[] };
        (S.orders = S.orders || []).push(o);
      }
      const rid = e.rowId || uid();
      o.rows.push({ id:rid, mode: e.art && getArt(e.art) ? "code" : "man", art:e.art || "", man: e.custom ? { ...e.custom } : { fam:"", dia:"", cls:"", len:"", col:"" }, fin:e.fin || "", lav:e.lav || "", qty:e.qty || "", planned:[] });
      return "ordine";
    }

  if (!b) b = S.backlog.find(x => x.entry && x.entry.art && x.entry.art === e.art && (x.planned || []).some(p => p.wk === wk && p.rep === rep && p.line === line));
  if (b){
    normItem(b);
    for (let i = b.planned.length - 1; i >= 0; i--){ const p = b.planned[i]; if (p.wk === wk && p.rep === rep && p.line === line){ b.planned.splice(i, 1); break; } }

function todoQuickSave(q){
  const s = q.sel; let entry;

    const c = { fam:s.fam, dia:s.dia||"", cls:s.cls||"", col:s.col||"", len:s.len||"" };

function bindTodoQuick(){
  const qi = dlg.querySelector("#tqi"), q = UI.qe; if (!qi || !q || !q.todo) return;
  quickPreview();
  qi.oninput = () => { q.text = qi.value; q.err = ""; if (q.pend && q.pend.text !== qi.value.trim()) q.pend = null; quickPreview(); };
  const redraw = () => { drawTodo(); const n = dlg.querySelector("#tqi"); if (n){ n.focus({ preventScroll:true }); if (UI.qe && UI.qe.pre){ n.select(); UI.qe.pre = false; } else n.setSelectionRange(n.value.length, n.value.length); } };
  qi.onkeydown = ev => {
    if (ev.key === "Escape"){ ev.preventDefault(); ev.stopPropagation(); if (q.text || q.hist.length){ UI.qe = newTodoQe(); redraw(); } else dlg.close(); return; }
    if (q.step === "art" && (ev.key === "ArrowDown" || ev.key === "ArrowUp")){
      ev.preventDefault(); const n = Math.min(rowsFor(q.sel).length, 12);
      q.pick = Math.max(0, Math.min(n-1, q.pick + (ev.key === "ArrowDown" ? 1 : -1))); quickPreview(); return;
    }
    if (ev.key === "Tab" && ev.shiftKey){ ev.preventDefault(); if (qBack(q)) redraw(); return; }
    const done = () => { if (todoQuickSave(q)){ UI.qe = newTodoQe(); redraw(); } };
    if (ev.key === "Tab" || ev.key === "Enter"){
      ev.preventDefault();
      if (q.step === "fam" && !q.text.trim()) return;
      if (q.step === "fam" && ev.key === "Enter" && !findArt(q.text) && !famMatches(q.text).length){
        snap(); const machines = TD.line ? [[TD.rep, TD.line]] : [];
        S.backlog.push(normItem({ id:uid(), entry:{ id:uid(), art:null, text:q.text.trim(), qty:"", note:"", cont:false }, machines, qmin:"", mag:false, urg:"Media", rif:"", planned:[], at:new Date().toISOString() }));
        Store.save(); render(); UI.qe = newTodoQe(); redraw(); toast("Aggiunto come testo libero"); return;
      }
      if (!qAccept(q)){ quickPreview(); qi.select(); return; }
      if (q.step === "note") return done();
      if (q.step !== "qty") qAdvance(q);
      if (ev.key === "Enter" && (q.sel.art || q.custom) && (q.step === "qty" || q.step === "note")) return done();
      redraw();
    }
  };
}

    else if (useMacro){ sub = TD.f.dia ? `Diametro Ø${fmtNum(TD.f.dia)}, diviso per macrocategoria.` : "Diviso per macrocategoria."; body = byMacro(list); }
    else if (UI.todoSort === "line"){
      sub = "Diviso per linea. Un articolo con più macchine compare sotto ognuna.";
      const groups = [{ t:"Senza macchina", f:b => !b.machines.filter(validM).length }];
      REPS.forEach(rp => REPARTI[rp].linee.filter(l => !l.act).forEach(l => groups.push({ t:`${REPARTI[rp].nome}, ${l.nome}`, f:b => onMachine(b, rp, l.id) })));
      body = byGroups(groups, list);
    } else {
      sub = "Tutti i reparti. Un articolo può essere assegnato a più macchine: compare nella colonna di ognuna.";
      const groups = [{ t:"Senza macchina", f:b => !b.machines.filter(validM).length }];
      REPS.forEach(rp => groups.push({ t:REPARTI[rp].nome, f:b => b.machines.some(m => m[0] === rp) }));
      body = byGroups(groups, list);
    }
    if (!body) body = `<p class="hint">${anyFilter ? "Nessun articolo con questi filtri." : "Nessun articolo. Inseriscili qui sopra come nella tabella."}</p>`;
  }
  const q = UI.qe;
  const qbar = roList ? `<div class="banner" style="margin:0 0 12px"><span>Sola visualizzazione. Per modificare l’elenco entra in <b>Modifica il programma</b>.</span></div>` : `<div class="tqbar">${qeHTML(true)}<p class="hint">Inserisci come nella tabella: famiglia <kbd>Tab</kbd> diametro <kbd>Tab</kbd> PN <kbd>Tab</kbd> lunghezza <kbd>Tab</kbd> quantità minima (o <b>M</b> per Magazzino) <kbd>Tab</kbd> note <kbd>Tab</kbd>. Le macchine vengono proposte da sole se l’articolo le ha già.</p></div>`;
  dlg.innerHTML = `<div class="dh"><div><h2>${esc(title)}</h2><p>${esc(sub)}${roList || canPlan() ? "" : " Settimana in sola lettura: puoi modificare l’elenco ma non programmare."}</p></div><button class="icon" id="x" aria-label="Chiudi">×</button></div>
    <div class="db">${qbar}${filterBarHTML()}<div class="cattool"><input id="tq" value="${esc(TD.q)}" placeholder="Cerca nell’elenco per diametro, codice, note" autocomplete="off">${roList ? "" : `<button class="ghost" id="tmouse">+ Inserisci con il mouse</button>`}${TD.line ? `<button class="ghost" id="tall">Vedi tutti i reparti</button>` : ""}<span class="fsctl" title="Dimensione del carattere nella stampa dell’elenco">Carattere stampa <button class="ghost" id="fsm" aria-label="Più piccolo">A−</button><b id="fsv">${fmtNum(todoFont())} pt</b><button class="ghost" id="fsp" aria-label="Più grande">A+</button></span><button class="ghost" id="tprint" title="Stampa l’elenco così come lo vedi, con filtri e ordinamento">Stampa elenco</button></div><div id="tlist">${body}</div></div>`;
  const $ = id => dlg.querySelector("#" + id);
  $("x").onclick = () => dlg.close();
  $("tq").oninput = e => { TD.q = e.target.value; const pos = e.target.selectionStart; drawTodo(); const n = $("tq"); n.focus(); n.setSelectionRange(pos, pos); };
  if ($("tall")) $("tall").onclick = () => openTodo(null, null);
  $("tprint").onclick = printTodoList;
  const fsShow = v => { $("fsv").textContent = fmtNum(v) + " pt"; };
  $("fsm").onclick = () => fsShow(setTodoFont(todoFont() - 1));
  $("fsp").onclick = () => fsShow(setTodoFont(todoFont() + 1));
  ["ffam","fdia","fline","fmac"].forEach(id => { const el = $(id); if (el) el.onchange = () => { TD.f[{ ffam:"fam", fdia:"dia", fline:"line", fmac:"macro" }[id]] = el.value; drawTodo(); }; });
  if ($("fclear")) $("fclear").onclick = () => { TD.f = { fam:"", dia:"", line:"", macro:"" }; drawTodo(); };
  if ($("fsort")) $("fsort").onchange = e => { UI.todoSort = e.target.value; drawTodo(); };
  if ($("tmouse")) $("tmouse").onclick = () => { UI.qe = null; openEditor({ mode:"bl", back:{ rep:TD.rep, line:TD.line } }); };
  dlg.querySelectorAll("[data-mck]").forEach(c => c.onchange = () => {
    const b = S.backlog.find(x => x.id === c.dataset.mck), m = c.value.split("|"); snap();
    if (c.checked){ if (!onMachine(b, m[0], m[1])) b.machines.push(m); } else b.machines = b.machines.filter(x => !sameM(x, m));
    learnMachines(b.entry, b.machines, true);
    Store.save(); render();
    const sum = c.closest("details").querySelector("summary"); const names = b.machines.filter(validM).map(lineName);
    sum.innerHTML = names.length ? esc(names.join(", ")) : `<span class="warn">Scegli le macchine</span>`;
  });
  dlg.querySelectorAll("details.tmach").forEach(d => d.addEventListener("toggle", () => { if (!d.open) drawTodo(); }));
  dlg.querySelectorAll(".tmok").forEach(b => b.onclick = () => { b.closest("details").open = false; });
  /* chiude la scelta macchine cliccando fuori o con Esc */
  dlg.onmousedown = ev => { dlg.querySelectorAll("details.tmach[open]").forEach(d => { if (!d.contains(ev.target)) d.open = false; }); };
  dlg.oncancel = ev => { const d = dlg.querySelector("details.tmach[open]"); if (d){ ev.preventDefault(); d.open = false; } };
  dlg.querySelectorAll("[data-plan]").forEach(s => s.onchange = () => { if (!s.value) return; const [rp, ln, wk] = s.value.split("|"); scheduleTodo(s.dataset.plan, rp, ln, wk); drawTodo(); });
  dlg.querySelectorAll("[data-tedit]").forEach(b => b.onclick = () => { const db = dlg.querySelector(".db"); TD.scroll = db ? db.scrollTop : null; TD.focusId = b.dataset.tedit; openEditor({ mode:"bl", blId:b.dataset.tedit, back:{ rep:TD.rep, line:TD.line } }); });
  dlg.querySelectorAll("[data-tdel]").forEach(b => b.onclick = () => { if (!confirm("Togliere questo articolo dall’elenco da produrre?")) return; snap(); S.backlog = S.backlog.filter(x => x.id !== b.dataset.tdel); Store.save(); render(); drawTodo(); toast("Tolto dall’elenco"); });
  bindTodoQuick();
  if (!roList) bindTodoDrag();
  ks.restore();
}

/* ---------- codici di rigranulazione e triturazione ---------- */
function toggleAct(line, day, n){
  if (readOnly()) return;
  snap();
  const L = cellList(line, day), i = L.findIndex(e => e.act === n);
  if (i >= 0) L.splice(i, 1);
  else L.push({ id:uid(), act:n, art:null, text:"Cod. " + n + " " + ACT[n], qty:"", note:"", cont:false });
  L.sort((a,b) => (a.act || "9").localeCompare(b.act || "9"));
  UI.fc = { line, day }; Store.save(); render();
}
function openActPicker(line, day, startText){
  if (readOnly()) return;
  const L = REPARTI[UI.rep].linee.find(l => l.id === line), list = cellList(line, day), cur = new Set(list.filter(e => e.act).map(e => e.act));
  const texts = list.filter(e => !e.act && !isProd(e));
  dlg.innerHTML = `<div class="dh"><div><h2>${esc(L.nome)} – ${GIORNI[day]} ${addDays(fromKey(UI.wk), day).getDate()}</h2><p>Clicca i codici da inserire, clicca di nuovo per toglierli. Dalla tabella puoi anche selezionare la cella e premere i tasti da 1 a 7.</p></div><button class="icon" id="x" aria-label="Chiudi">×</button></div>
    <div class="db"><div class="actpick">${Object.entries(ACT).map(([k,v]) => `<button class="chip" data-act="${k}" aria-pressed="${cur.has(k)}"><span class="fn">${k}</span>${esc(v)}</button>`).join("")}</div>
      <label class="field" style="margin-top:14px"><span>Oppure testo libero (manutenzione, idem…)</span><div style="display:flex;gap:8px"><input id="acttxt" value="${esc(startText || "")}" placeholder="es. Manutenzione"><button class="ghost" id="actadd">Aggiungi</button></div></label>
      ${texts.length ? `<div class="acttexts">${texts.map(e => `<div><span>${esc(e.text)}</span><button class="ghost" data-deltxt="${e.id}">Togli</button></div>`).join("")}</div>` : ""}</div>
    <div class="df"><span class="grow"></span><button class="primary" id="actok">Fatto</button></div>`;
  const $ = id => dlg.querySelector("#" + id);
  const addTxt = () => { const v = $("acttxt").value.trim(); if (!v) return; snap(); cellList(line, day).push({ id:uid(), art:null, text:v, qty:"", note:"", cont:false }); UI.fc = { line, day }; Store.save(); render(); openActPicker(line, day); };
  $("x").onclick = $("actok").onclick = () => { if ($("acttxt").value.trim()) addTxt(); dlg.close(); };
  $("actadd").onclick = addTxt;
  $("acttxt").onkeydown = ev => { if (ev.key === "Enter"){ ev.preventDefault(); addTxt(); } };
  dlg.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { toggleAct(line, day, b.dataset.act); openActPicker(line, day); });
  dlg.querySelectorAll("[data-deltxt]").forEach(b => b.onclick = () => { snap(); const Lc = cellList(line, day); Lc.splice(Lc.findIndex(x => x.id === b.dataset.deltxt), 1); Store.save(); render(); openActPicker(line, day); });
  if (!dlg.open) dlg.showModal();
  if (startText){ const i = $("acttxt"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/* ---------- scheda in primo piano (sola lettura) ---------- */
function openCardView(line, day, ids){

        ${r ? `<div class="cvd">${esc(getArt(e.art) ? getArt(e.art)[1] : "")}</div><div class="cvs">${esc((famNum(r[2]) ? "Cod. " + famNum(r[2]) + " " : "") + famLabelE(e, r) + ", " + spec(r))}</div>` : ""}

       ${e.fin ? `<div class="cvf"><span>Diventa (codice finito)</span><p><b>${esc(e.fin)}</b>${getArt(e.fin) ? " – " + esc(getArt(e.fin)[1]) : ""}</p></div>` : ""}${e.lav ? `<div class="cvf"><span>Lavorazione</span><p>${esc(e.lav)}</p></div>` : ""}${e.qty ? `<div class="cvf"><span>Quantità</span><p>${esc(e.qty)}</p></div>` : ""}${e.note ? `<div class="cvf"><span>Note</span><p>${esc(e.note)}</p></div>` : ""}`
    : `<div class="cvf"><span>Nota</span><p>${esc(e.text)}</p></div>${e.note ? `<div class="cvf"><p>${esc(e.note)}</p></div>` : ""}`); }).join(`<hr class="cvsep">`);

  dlg.querySelector("#x").onclick = () => dlg.close();

/* ---------- editor lavorazione ---------- */
let ED = null;
const dlg = document.getElementById("dlg");
function openEditor(o){
  ED = { ...o, clients:[], tab:"prod", cx:{ fam:"", dia:"", cls:"", len:"", col:"", code:"" }, sel:{fam:null,dia:null,cls:null,col:null,len:null,art:null}, q:"", qty:"", note:"", text:"", urg:"Media", rif:"", plan:"", showAll:false };
  let e = null;
  if (o.mode === "job" && o.id) e = cellList(o.line, o.day).find(x => x.id === o.id);
  if (o.mode === "bl" && o.blId){ const b = S.backlog.find(x => x.id === o.blId); e = b.entry; ED.urg = b.urg; ED.rif = b.rif; ED.qmin = b.qmin; ED.mag = b.mag; ED.clients = clone(b.clients || []); }
  if (e){ ED.fluid = !!e.fluid; ED.lav = e.lav || ""; ED.fin = e.fin || ""; ED.qty = o.mode === "bl" ? (ED.qmin || "") : e.qty||""; ED.note = e.note||""; if (e.custom){ ED.tab = "fuori"; ED.cx = { ...e.custom, code:e.art||"" }; } else if (e.art) pickArt(e.art); else { ED.tab = "nota"; ED.text = e.text||""; } ED.cont = e.cont; }
  drawEditor(); if (!dlg.open) dlg.showModal();
}
function pickArt(a){ const r = getArt(a); if (!r){ ED.tab="nota"; ED.text=a; return; } ED.sel = {fam:r[2],dia:r[3],cls:r[4],col:r[6],len:r[5],art:a}; ED.q = ""; }
const rowsFor = s => CODICI.filter(r => (!s.fam||r[2]===s.fam) && (!s.fams||s.fams.includes(r[2])) && (s.dia==null||r[3]===s.dia) && (s.cls==null||r[4]===s.cls) && (s.col==null||r[6]===s.col) && (s.len==null||r[5]===s.len));
const uniq = (rows, i) => [...new Set(rows.map(r => r[i]))].sort((a,b) => (parseFloat(a)||0)-(parseFloat(b)||0) || String(a).localeCompare(b));
function normalize(){
  const s = ED.sel; if (!s.fam) return;
  for (const [k,i] of [["dia",3],["cls",4],["col",6],["len",5]]){
    if (s[k] != null) continue;
    const opts = uniq(rowsFor(s), i);
    if (opts.length === 1) s[k] = opts[0]; else break;
  }
  if (!s.art && s.len != null){ const rs = rowsFor(s); if (rs.length === 1) s.art = rs[0][0]; }
}
function stepHTML(label, key, idx, fmt){
  const s = ED.sel, prev = {...s}; ["dia","cls","col","len","art"].slice(["dia","cls","col","len","art"].indexOf(key)).forEach(k => prev[k] = null);
  const opts = uniq(rowsFor(prev), idx);
  if (opts.length <= 1 && !(opts.length===1 && opts[0]!=="" && key!=="col" && key!=="cls")) return "";
  const other = key === "dia" ? `<button class="chip other" data-other="dia">Altro diametro…</button>` : key === "len" ? `<button class="chip other" data-other="len">Altra lunghezza…</button>` : "";
  return `<div class="step"><span>${label}</span><div class="chips">${opts.map(v => `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${s[key]===v}">${fmt(v)}</button>`).join("")}${other}</div></div>`;
}
function drawEditor(){
  const rep = REPARTI[UI.rep], s = ED.sel;
  normalize();
  const isBl = ED.mode === "bl";
  const lineName = (rep.linee.find(l => l.id === ED.line)||{}).nome || "";
  const title = isBl ? (ED.blId ? "Articolo da produrre" : "Nuovo articolo da produrre") : (ED.id ? "Modifica lavorazione" : "Nuova lavorazione");
  const sub = isBl ? (ED.back && ED.back.line ? `Verrà assegnato a ${REPARTI[ED.back.rep].nome} ${REPARTI[ED.back.rep].linee.find(l => l.id === ED.back.line).nome}` : "Elenco del materiale da produrre") : `${rep.nome}, ${lineName} – ${GIORNI[ED.day]} ${addDays(fromKey(UI.wk),ED.day).getDate()}`;
  let body = `<div class="seg" role="group"><button data-tab="prod" aria-pressed="${ED.tab==="prod"}">Prodotto</button><button data-tab="fuori" aria-pressed="${ED.tab==="fuori"}">Fuori catalogo</button><button data-tab="nota" aria-pressed="${ED.tab==="nota"}">Solo testo</button></div>`;
  if (ED.tab === "prod"){
    const r = s.art ? getArt(s.art) : null;

      body += `<div class="results">${res.length ? res.map(r => `<button data-art="${esc(r[0])}"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></button>`).join("") : `<div class="empty" style="padding:8px 10px">Nessun articolo trovato. Prova con meno parole, o usa “Cambio o nota” per un codice nuovo.</div>`}</div>`;
    }

  if (!isBl && rep.lav) body += `<label class="field"><span>Lavorazione</span><input id="lav" value="${esc(ED.lav || "")}" placeholder="es. F6N slot 4,00 mm"></label>`;
  body += `<div class="row2"><label class="field"><span>${isBl ? "Quantità minima" : "Quantità"}</span><input id="qty" value="${esc(ED.qty)}" placeholder="${isBl ? "es. 3036 m" : "es. 10 bancali, 768 m"}" ${isBl && ED.mag ? "disabled" : ""}></label><label class="field"><span>Note</span><input id="note" value="${esc(ED.note)}" placeholder="es. marcatura Carini"></label></div>`;

      <button class="primary" id="save" ${canSave?"":"disabled"}>Salva</button>

function grab(){
  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const fl = document.getElementById("fluid"); if (fl) ED.fluid = fl.checked;
  if (v("lav") != null) ED.lav = v("lav");
  if (v("fin") != null) ED.fin = v("fin");
  if (v("qty") != null) ED.qty = v("qty"); if (v("note") != null) ED.note = v("note");
  if (v("text") != null) ED.text = v("text"); if (v("rif") != null) ED.rif = v("rif");
  const mg = document.getElementById("bmag"); if (mg) ED.mag = mg.checked; if (v("plan") != null) ED.plan = v("plan");
  if (v("moveday") != null) ED.moveday = +v("moveday");
  if (v("cfam") != null) ED.cx = { fam:v("cfam"), dia:v("cdia"), cls:v("ccls"), len:v("clen"), col:v("ccol"), code:v("ccode") };
}
function bindEditor(){
  const $ = id => document.getElementById(id);
  dlg.querySelectorAll("[data-other]").forEach(b => b.onclick = () => {
    grab(); const s = ED.sel, k = b.dataset.other;
    ED.cx = { fam:s.fam || "", dia: k === "dia" ? "" : (s.dia || ""), cls: k === "dia" ? "" : (s.cls || ""), col: k === "dia" ? "" : (s.col || ""), len:"", code:"" };
    ED.tab = "fuori"; ED.fuoriMsg = true; ED.focus = k === "dia" ? "cdia" : "clen"; drawEditor();
  });
  if (ED.focus){ const f = $(ED.focus); ED.focus = null; if (f){ f.focus(); f.select(); } }
  $("x").onclick = () => dlg.close();
  dlg.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    grab();
    if (b.dataset.tab === "fuori" && !ED.cx.fam && ED.sel.fam){ const s = ED.sel; ED.cx = { fam:s.fam, dia:s.dia||"", cls:s.cls||"", len:s.len||"", col:s.col||"", code:"" }; }
    ED.tab = b.dataset.tab; drawEditor();
  });
  ["cfam","cdia","ccls","clen","ccode"].forEach(id => { const el = $(id); if (el) el[id === "cfam" ? "onchange" : "oninput"] = () => { grab(); if (id === "cfam") drawEditor(); else $("save").disabled = !(ED.cx.fam && (ED.cx.dia || ED.cx.len || ED.cx.code)); }; });
  dlg.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    grab(); const k = b.dataset.k, order = ["fam","dia","cls","col","len","art"];
    order.slice(order.indexOf(k)).forEach(x => ED.sel[x] = null); ED.sel[k] = b.dataset.v; drawEditor();
  });
  dlg.querySelectorAll("[data-art]").forEach(b => b.onclick = () => { grab(); pickArt(b.dataset.art); drawEditor(); });
  dlg.querySelectorAll("[data-urg]").forEach(b => b.onclick = () => { grab(); ED.urg = b.dataset.urg; drawEditor(); });
  if ($("allfam")) $("allfam").onclick = () => { grab(); ED.showAll = !ED.showAll; drawEditor(); };
  if ($("q")){ const q = $("q"); q.oninput = () => { grab(); ED.q = q.value; const pos = q.selectionStart; drawEditor(); const n = $("q"); n.focus(); n.setSelectionRange(pos,pos); }; }
  if ($("text")) $("text").oninput = () => { ED.text = $("text").value; $("save").disabled = !ED.text.trim(); };

  if ($("saveadd")) $("saveadd").onclick = () => saveEditor(true);
  if ($("del")) $("del").onclick = () => { snap();
    if (ED.mode === "bl"){ S.backlog = S.backlog.filter(x => x.id !== ED.blId); const back = ED.back; dlg.close(); commit("Tolto dall’elenco"); if (back) openTodo(back.rep, back.line); return; }
    else { const L = cellList(ED.line, ED.day); L.splice(L.findIndex(x => x.id === ED.id), 1); }
    dlg.close(); commit("Eliminato");
  };
  if ($("toback")) $("toback").onclick = () => {
    snap(); const L = cellList(ED.line, ED.day), i = L.findIndex(x => x.id === ED.id); if (i < 0) return;
    const [x] = L.splice(i, 1); const w = returnToList(x, UI.rep, ED.line, UI.wk); dlg.close(); commit(w === "ordine" ? "Rimesso tra gli ordini da lavorare" : "Rimesso nell’elenco da produrre");
  };

    grab(); const e = cellList(ED.line, ED.day).find(x => x.id === ED.id);
    cellList(ED.line, ED.day+1).push({ ...clone(e), id:uid(), cont:true, qty:"", note:"" });
    dlg.close(); commit("Continua anche " + GIORNI[ED.day+1].toLowerCase());
  };
}
function saveEditor(again){
  grab(); snap();
  const c = ED.cx;
  const entry = ED.tab === "prod" ? { art:ED.sel.art, text:null, custom:null }
    : ED.tab === "fuori" ? { art:upCode(c.code), text:null, custom:{ fam:c.fam, dia:normV(c.dia), cls:normV(c.cls), len:normV(c.len), col:c.col.trim().toUpperCase() } }
    : { art:null, text:ED.text.trim(), custom:null };
  Object.assign(entry, { qty:ED.qty.trim(), note:ED.note.trim() });
  const famSaved = ED.tab === "prod" ? (getArt(entry.art) || [])[2] : ED.tab === "fuori" ? ED.cx.fam : null;
  if (famSaved === FLUID_FAM && ED.fluid) entry.fluid = true; else entry.fluid = false;
  if (ED.mode !== "bl" && REPARTI[UI.rep].lav) entry.lav = (ED.lav || "").trim();
  if (ED.mode !== "bl" && REPARTI[UI.rep].fin){ const fa = getArt(ED.fin); entry.fin = fa ? fa[0] : upCode(ED.fin); }
  if (entry.custom && entry.art){
    const ex = getArt(entry.art);
    const editingSame = ED.id && (cellList(ED.line, ED.day).find(x => x.id === ED.id)||{}).art === entry.art && ex && ex[7];
    if (ex && !editingSame){ UNDO.pop(); toast(`Il codice ${entry.art} esiste già: ${ex[1]}`); return; }
    if (!ex){ registerArticle(entry.art, entry.custom); entry.custom = null; toast(entry.art + " aggiunto all’anagrafica"); }
  }
  if (ED.mode === "bl"){
    let b = ED.blId && S.backlog.find(x => x.id === ED.blId);
    if (!b){ b = normItem({ id:uid(), machines:[], planned:[], at:new Date().toISOString() }); S.backlog.push(b); }
    Object.assign(b, { urg:ED.urg, rif:ED.rif.trim(), qmin: ED.mag ? "" : ED.qty.trim(), mag: !!ED.mag, clients:(ED.clients || []).map(c => ({ name:(c.name || "").trim(), qty:(c.qty || "").trim() })).filter(c => c.name), entry:{ ...entry, qty:"", id:uid(), cont:false } });
    if (!b.machines.length){ b.machines = proposeMachines(b.entry); }
    if (ED.back && ED.back.line && !onMachine(b, ED.back.rep, ED.back.line)) b.machines.push([ED.back.rep, ED.back.line]);
    if (b.machines.length) learnMachines(b.entry, b.machines, false);
    const back = ED.back;
    dlg.close(); commit("Salvato nell’elenco da produrre");
    if (back) openTodo(back.rep, back.line);
    return;
  }
  const L = cellList(ED.line, ED.day);
  if (ED.id && !L.find(x => x.id === ED.id)){ ED.id = null; toast("La lavorazione era stata modificata da un collega: salvata come nuova"); }
  if (ED.id){
    const e = L.find(x => x.id === ED.id); Object.assign(e, entry); if (ED.tab!=="prod" || e.art !== entry.art) e.cont = false; if (!entry.custom) delete e.custom;
    if (ED.moveday != null && ED.moveday !== ED.day){ L.splice(L.indexOf(e),1); cellList(ED.line, ED.moveday).push(e); }
  } else L.push({ id:uid(), cont:false, ...entry });
  learnMachine(entry, UI.rep, ED.line, false);
  Store.save(); render();
  if (again){ const keep = { fam:ED.sel.fam, dia:ED.sel.dia, cls:ED.sel.cls }; ED.id = null; ED.sel = { ...keep, col:null, len:null, art:null }; ED.qty = ""; ED.note = ""; ED.q = ""; drawEditor(); toast("Salvato, scegli il formato successivo"); }
  else { dlg.close(); toast("Salvato"); }
}

  const w = weekObj(UI.wk, true), lr = lastRev(w), n = lr ? lr.n + 1 : 1;
  const ch = lr ? diff(lr.data, w.draft) : [];
  const m = fromKey(UI.wk);
  dlg.innerHTML = `<div class="dh"><div><h2>Pubblica la Rev. ${n}</h2><p>Settimana ${isoWeek(m)}, ${rangeLabel(m)}. Le modifiche valgono per tutti e tre i reparti.</p></div><button class="icon" id="x" aria-label="Chiudi">×</button></div>
  <div class="db">
    ${lr ? `<ul class="changes">${ch.map(c => { const t = changeText(c, UI.wk); return `<li><span class="k ${c.kind}">${t.verb}</span><span><b>${esc(t.where)}</b><br>${esc(t.what)}</span></li>`; }).join("")}</ul>`
         : `<p>Prima pubblicazione di questa settimana: la mail dirà che il programma è in allegato. Ricordati di allegare il PDF (Esporta PDF).</p>`}
    <label class="field"><span>Messaggio aggiuntivo, facoltativo</span><textarea id="msg" placeholder="es. Anticipata la produzione del Ø110 RC2 per l’ordine urgente"></textarea></label>
    <p class="hint">Dopo la pubblicazione si apre Outlook con la mail già compilata per tutti i contatti: puoi rileggerla e modificarla prima di premere Invia.</p>
  </div>
  <div class="df"><span class="grow"></span><button class="ghost" id="annulla">Annulla</button><button class="primary" id="go">Pubblica Rev. ${n}</button></div>`;
  dlg.querySelector("#x").onclick = dlg.querySelector("#annulla").onclick = () => dlg.close();
  dlg.querySelector("#go").onclick = () => {
    const msg = dlg.querySelector("#msg").value.trim();
    const rev = { n, at:new Date().toISOString(), data:clone(w.draft), changes:ch.map(c => changeText(c, UI.wk)), msg };
    w.revs.push(rev); UI.viewAuto = false; UI.editMode = true; UI.view = "draft"; Store.save(); render(); showMail(rev);
  };
  if (!dlg.open) dlg.showModal();
}
function fullText(data, wk){
  const lines = [];
  REPS.forEach(rep => { const R = REPARTI[rep]; let block = [];
    R.linee.forEach(l => { const days = data[rep][l.id]; const parts = [];
      spansOf(data, rep, l.id).forEach(e => parts.push(`  Settimana: ${describe(e)}`));
      days.forEach((list,d) => list.forEach(e => parts.push(`  ${GG[d]} ${addDays(fromKey(wk),d).getDate()}: ${e.cont ? "continua " : ""}${describe(e)}`)));
      if (parts.length) block.push(`${l.nome} (${l.mac})`, ...parts); });
    if (block.length) lines.push(R.nome.toUpperCase(), ...block, ""); });
  if (data.note) lines.push("NOTE GENERALI", data.note, "");
  return lines.join("\n");
}
function mailFor(rev){
  const m = fromKey(UI.wk), wn = isoWeek(m), C = S.contacts;
  const subject = rev.n === 1 ? `Programma di produzione WK ${wn}` : `Aggiornamento programma di produzione settimana ${wn} – Rev. ${rev.n}`;
  let body = rev.n === 1 ? "" : `Buongiorno,\n\n`;
  if (rev.n === 1){
    body = `Buon pomeriggio,\n\nin allegato programma di produzione della settimana ${wn}.\n` + (rev.msg ? `\n${rev.msg}\n` : "") + `\nSaluti`;
  }
  else body += `il programma di produzione della settimana ${wn} (${rangeLabel(m)}) è stato aggiornato alla Rev. ${rev.n}.\n\nModifiche:\n${rev.changes.map(c => `- ${c.where}: ${c.verb} ${c.what}`).join("\n")}\n`;
  if (rev.n !== 1){
    if (rev.msg) body += `\n${rev.msg}\n`;
    if (C.link) body += `\nProgramma sempre aggiornato: ${C.link}\n`;
    body += `\nSaluti\n${C.firma}`;
  }
  const cc = C.cc.split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
  const base = `mailto:${encodeURIComponent(C.to.trim()).replace(/%40/g,"@")}?cc=${encodeURIComponent(cc.join(";"))}&subject=${encodeURIComponent(subject)}&body=`;
  let href = base + encodeURIComponent(body), long = false;
  if (href.length > 1900){
    long = true;
    href = base + encodeURIComponent(`Buongiorno,\n\n[Il testo completo è stato copiato: incollalo qui con Ctrl+V]\n\nSaluti\n${C.firma}`);
  }
  return { subject, body, href, cc, long };
}
function showMail(rev){
  const M = mailFor(rev);
  dlg.innerHTML = `<div class="dh"><div><h2>Rev. ${rev.n} pubblicata</h2><p>Ora prepara la mail per ${1 + M.cc.length} contatti.</p></div><button class="icon" id="x" aria-label="Chiudi">×</button></div>
  <div class="db">
    <label class="field"><span>Oggetto</span><input readonly value="${esc(M.subject)}"></label>
    <label class="field"><span>Testo</span><textarea id="mt" readonly style="min-height:200px">${esc(M.body)}</textarea></label>
    <p class="hint">Se vuoi allegare anche i PDF dei tre reparti, usa Esporta PDF e trascina i file nella mail aperta.</p>
  </div>
  ${M.long ? `<div class="warnbox">Il testo è troppo lungo per essere passato a Outlook in automatico. Premendo “Apri in Outlook” viene copiato: nella mail che si apre incollalo con <b>Ctrl+V</b>.</div>` : ""}
  <div class="df"><button class="ghost" id="copy">Copia testo</button><span class="grow"></span><a class="primary mailbtn" id="mailgo" href="${esc(M.href)}" target="_blank" rel="noopener">Apri in Outlook</a></div>`;
  dlg.querySelector("#x").onclick = () => dlg.close();
  const copyBody = async () => { const t = dlg.querySelector("#mt"); try { await navigator.clipboard.writeText(t.value); } catch(_){ t.select(); try { document.execCommand("copy"); } catch(__){} } };
  if (M.long) dlg.querySelector("#mailgo").addEventListener("click", () => { copyBody(); toast("Testo copiato: incollalo nella mail con Ctrl+V"); });
  dlg.querySelector("#copy").onclick = async () => {
    const t = dlg.querySelector("#mt");
    try { await navigator.clipboard.writeText(t.value); } catch(_){ t.select(); try { document.execCommand("copy"); } catch(__){} }
    toast("Testo copiato");
  };
  if (!dlg.open) dlg.showModal();
}

  <div class="df">${c.kind === 1 ? `<button class="danger" id="edel">Elimina articolo</button>` : ""}${c.kind === 2 ? `<button class="ghost" id="eorig">Ripristina dati originali</button>` : ""}
    <span class="grow"></span><button class="ghost" id="eback">Torna alla lista</button><button class="primary" id="esave">Salva</button></div>`;
  const $ = id => dlg.querySelector("#"+id);
  const read = () => Object.assign(c, { code:c.isNew ? upCode($("ec").value) : $("ec").value.trim(), fam:$("ef").value, desc:$("ed").value.trim(), dia:normV($("edia").value), cls:normV($("ecls").value), len:normV($("elen").value), col:$("ecol").value.trim().toUpperCase() });
  $("x").onclick = () => dlg.close();
  $("eback").onclick = () => { CAT.edit = null; drawCatalog(); };
  $("ef").onchange = () => { read(); c.dia = $("edia").value; c.cls = $("ecls").value; c.len = $("elen").value; drawCatEdit(); };
  $("esave").onclick = () => {
    read();
    if (!c.code) return toast("Scrivi il codice");
    if (c.isNew && !!getArt(c.code)) return toast(`Il codice ${c.code} esiste già`);
    const desc = c.desc || customDesc(c);
    snap();
    if (c.isNew) S.extra.push([c.code, desc, c.fam, c.dia, c.cls, c.len, c.col, new Date().toISOString()]);
    else if (c.kind === 1){ const r = S.extra.find(x => x[0] === c.code); Object.assign(r, { 1:desc, 2:c.fam, 3:c.dia, 4:c.cls, 5:c.len, 6:c.col }); }
    else { S.edits = S.edits || {}; S.edits[c.code] = [desc, c.fam, c.dia, c.cls, c.len, c.col]; }
    syncCatalog(); Store.save(); render(); toast(c.isNew ? c.code + " aggiunto" : c.code + " salvato");
    CAT.edit = null; CAT.q = c.code; drawCatalog();
  };
  if ($("eorig")) $("eorig").onclick = () => { snap(); delete S.edits[c.code]; syncCatalog(); Store.save(); render(); toast("Ripristinato"); CAT.edit = null; drawCatalog(); };
  if ($("edel")) $("edel").onclick = () => {
    if (!confirm(`Eliminare ${c.code}? Le lavorazioni già programmate restano, segnate come fuori catalogo.`)) return;
    snap();
    const r = getArt(c.code), cu = { fam:r[2], dia:r[3], cls:r[4], len:r[5], col:r[6] };
    Object.values(S.weeks).forEach(w => [w.draft, ...w.revs.map(v => v.data)].forEach(d => REPS.map(k => d[k]).filter(Boolean).forEach(rep => Object.values(rep).forEach(days => days.forEach(list => list.forEach(e => { if (e.art === c.code && !e.custom) e.custom = { ...cu }; }))))));
    S.backlog.forEach(b => { if (b.entry.art === c.code && !b.entry.custom) b.entry.custom = { ...cu }; });
    S.extra = S.extra.filter(x => x[0] !== c.code); if (S.edits) delete S.edits[c.code];
    syncCatalog(); Store.save(); render(); toast(c.code + " eliminato"); CAT.edit = null; drawCatalog();
  };
}

    const a = document.createElement("a"), d = new Date();

    rd.onload = () => {
      let j; try { j = JSON.parse(rd.result); } catch(_){ return toast("File non valido"); }
      if (!j || j.app !== "riccini-programma-produzione" || !j.data || !j.data.weeks) return toast("Questo file non è una copia del programma");
      if (!confirm(`Ripristinare la copia del ${stamp(j.at)}? Tutto il programma attuale, per tutti gli utenti, verrà sostituito.`)) return;
      snap(); S = j.data; ["backlog","extra"].forEach(k => { if (!S[k]) S[k] = []; }); ["edits","machines","meta"].forEach(k => { if (!S[k]) S[k] = {}; });
      S.backlog.forEach(normItem); syncCatalog(); Store.save(); render(); dlg.close(); toast("Copia ripristinata");
    };
    rd.readAsText(file);
  };
  $("x").onclick = () => dlg.close();

  dlg.showModal();
}

const MESI_UP = ["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
const DEFAULT_PDF_BASE = "L:\\Nicola.Minguzzi\\PROGRAMMA PRODUZIONE {anno}";
function pdfFolder(){
  const m = fromKey(UI.wk), base = ((S.contacts && S.contacts.pdfBase) || DEFAULT_PDF_BASE).replace(/[\\\s]+$/, "");

const pdfName = key => `${key === "r5" ? "Reparto 5" : REPARTI[key].nome} - Settimana ${isoWeek(fromKey(UI.wk))}`;
